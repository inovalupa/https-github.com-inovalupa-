
<!DOCTYPE html>

    <title>Data Fan - América Futebol Clube Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      window.process = window.process || { env: {} };
      
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                orange: '#008037', // Reutilizando a chave para facilitar, mas com a cor do América (Verde)
                blue: '#0a2a1a',   // Verde Escuro/Preto
                dark: '#051021',
                light: '#F8FAFC'
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F3F4F6;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: #008037;
        border-radius: 10px;
      }
    </style>
